name: publish
on:
  release:
    types: [published]
  workflow_dispatch: # 手动补发：Release 触发失败后不必重发 Release

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24                          # engines 要求 >=24 或 ^22.19
          registry-url: https://registry.npmjs.org  # 生成带 ${NODE_AUTH_TOKEN} 的 .npmrc
      - run: npm publish                            # prepublishOnly 自动先跑 npm test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # granular token，勾了 Bypass 2FA
